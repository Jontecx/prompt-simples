name: Cron Diário — Publicar 2 Artigos por Dia

on:
  schedule:
    # 12:00 UTC (09:00 Brasília) e 21:00 UTC (18:00 Brasília) todos os dias
    - cron: "0 12,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar próximo artigo da pauta semanal (Autor Jonatas Alcântara)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://promptsimples.com.br' }}
        run: node scripts/generate-daily-post.mjs

      - name: Commit e Push para disparar deploy na Vercel
        run: |
          git config user.name "Jonatas Alcântara"
          git config user.email "bot@promptsimples.com.br"
          git add content/posts content/weekly-plan.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "feat(cron): publicar artigo automático diário"
            git push
          fi
